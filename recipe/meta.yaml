{% set versions = {
    "0.3.0.1": "49e578d286cc0abdfbe92cdd5a643ad893b7a619",
    "HEAD": "49e578d286cc0abdfbe92cdd5a643ad893b7a619",
    "0.3.0": "9d723bd21ccabb8cb5b0025edfd28305a037f8a5"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

package:
  name: {{ environ.get('ANACONDA_PACKAGE', 'minio-cpp')|string|lower }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

build:
  # 2026-09-08: root cause found. anaconda.org's record for this package
  # was corrupt, not the blobs -- its releases had ceased to exist
  # ("release hep-forge/minio-cpp/0.3.0 does not exist", 404) while all
  # 7 uploaded files stayed orphaned in storage with no parent release,
  # so the CDN 404'd every one of them. It was the only broken package
  # of 77 in the channel, and the earlier _0 -> _1 -> _2 build bumps just
  # added more orphans, which is why none of them helped. Fixed by a
  # package-level `anaconda remove hep-forge/minio-cpp` (release-scoped
  # removal is a no-op when the releases are already gone), then this
  # rebuild to repopulate from scratch. _3 rather than back to _0 so the
  # filename is one that has never been uploaded for this package.
  #
  # _4: the _3 build shipped a libminiocpp.so that records neither libcurlpp
  # nor libcurl in DT_NEEDED while carrying 30 undefined curlpp symbols, so
  # anything loading it died with "undefined symbol:
  # _ZTIN6curlpp12RuntimeErrorE" (root-plus CI: all four Cloud tests). The
  # patch now supplies curlpp::curlpp when curlpp's own config leaves
  # curlpp_LIBRARIES unset.
  number: 4

source:
  git_url: "https://github.com/minio/minio-cpp"
  git_rev: {{ versions.get(version, "HEAD") }}
  patches:
    - patches/0001-update-cmake.patch

requirements:
  build:
    - {{ compiler('cxx') }} # [linux]
    - {{ compiler('c') }}   # [linux]
    - {{ stdlib('c') }}

    - cmake
    - make

  host:
    - inih
    - curlpp
    - nlohmann_json
    - pugixml
    - zlib

  run:
    - inih
    - curlpp
    - nlohmann_json
    - pugixml
    - zlib

about:
  home: "https://github.com/minio/minio-cpp"
  license: "GPL-3.0"
  summary: "MinIO C++ Client SDK for Amazon S3 Compatible Cloud Storage"
  description: |
    MinIO C++ SDK is Simple Storage Service (aka S3) client to perform bucket and object operations to any Amazon S3 compatible object storage service.

extra:
  recipe-maintainers:
    - meiyasan
