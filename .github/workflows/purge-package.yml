name: Purge Anaconda Package (temporary)

# TEMPORARY, one-shot. anaconda.org's record for hep-forge/minio-cpp is
# corrupt: its releases no longer exist ("release .../0.3.0 does not
# exist", 404) while 7 uploaded files remain orphaned in storage, so the
# CDN 404s every blob and autodelete.yml's release-scoped `anaconda
# remove <pkg>/<version>` is a no-op. Only a package-level remove clears
# it. Delete this workflow once the package is rebuilt and downloadable.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the package name to confirm irreversible removal'
        required: true

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "minio-cpp" ]; then
            echo "confirm input did not match 'minio-cpp' -- aborting" >&2
            exit 1
          fi

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true

      - name: Install anaconda-client
        run: /usr/share/miniconda/bin/conda install -c conda-forge -y anaconda-client

      - name: Remove package
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          set -x
          /usr/share/miniconda/bin/anaconda -t "$ANACONDA_API_TOKEN" show hep-forge/minio-cpp || true
          /usr/share/miniconda/bin/anaconda -t "$ANACONDA_API_TOKEN" remove --force hep-forge/minio-cpp
          echo "## Purged hep-forge/minio-cpp" >> $GITHUB_STEP_SUMMARY
