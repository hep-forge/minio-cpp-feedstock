name: Purge stale ABI builds (temporary)

# TEMPORARY, one-shot. 0.3.0.1 was rebuilt once before the GCC 14 pin
# existed, so it published with a libstdcxx >=16 run_export, and once
# after. Both sit at the same version AND the same build number 3,
# differing only in the variant hash, so conda can legitimately pick
# either -- and picking the >=16 pair makes consumers (root-plus)
# unsolvable against the GCC 15-built rest of the channel. The trim step
# in autoupload.yml only removes whole versions, never single builds,
# so the stale pair has to go file by file. Delete this workflow after
# it runs.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the build hash prefix to confirm (hec23631)"
        required: true

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "hec23631" ]; then
            echo "confirm input did not match -- aborting" >&2; exit 1
          fi

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true

      - name: Install anaconda-client
        run: /usr/share/miniconda/bin/conda install -c conda-forge -y anaconda-client

      - name: Remove stale GCC 16 builds
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          set -x
          for F in linux-64/minio-cpp-0.3.0.1-hec23631_3.conda \
                   linux-aarch64/minio-cpp-0.3.0.1-hcbf05c8_3.conda; do
            /usr/share/miniconda/bin/anaconda -t "$ANACONDA_API_TOKEN" \
              remove --force "hep-forge/minio-cpp/0.3.0.1/$F"
          done
          /usr/share/miniconda/bin/anaconda -t "$ANACONDA_API_TOKEN" show hep-forge/minio-cpp || true
